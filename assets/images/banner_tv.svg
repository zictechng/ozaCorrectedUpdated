  <path d="M93 16 C99 22 99 32 93 38" stroke="rgba(255,255,255,0.5)" stroke-width="2" stroke-linecap="round" fill="none" />
  <path d="M98 12 C106 20 106 34 98 42" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" stroke-linecap="round" fill="none" />
  
  <!-- Sparkles -->
