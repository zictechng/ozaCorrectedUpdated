<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <circle cx="60" cy="60" r="52" fill="rgba(255,255,255,0.08)" />
  
  <!-- Back card (shadow) -->
  <rect x="28" y="35" width="68" height="52" rx="7" fill="rgba(255,255,255,0.3)" transform="rotate(-6 60 60)" />
  
  <!-- Main card -->
  <rect x="22" y="32" width="68" height="52" rx="7" fill="rgba(255,255,255,0.92)" />
  
  <!-- Card header stripe -->
  <rect x="22" y="32" width="68" height="16" rx="7" fill="rgba(245,158,11,0.85)" />
  <rect x="22" y="40" width="68" height="8" fill="rgba(245,158,11,0.85)" />
  
  <!-- Card header text -->
  <text x="56" y="44" text-anchor="middle" font-size="8" font-family="Arial" font-weight="bold" fill="white">EXAM CARD</text>
  
  <!-- PIN scratch area -->
  <rect x="30" y="54" width="52" height="14" rx="4" fill="rgba(245,158,11,0.15)" stroke="rgba(245,158,11,0.4)" stroke-width="1" stroke-dasharray="3,2" />
  <text x="56" y="64" text-anchor="middle" font-size="7" font-family="Arial" fill="rgba(245,158,11,0.8)">● ● ● ● ● ● ● ●</text>
  
  <!-- Card lines -->
  <line x1="30" y1="76" x2="82" y2="76" stroke="rgba(0,0,0,0.12)" stroke-width="1.5" stroke-linecap="round" />
  <line x1="30" y1="82" x2="65" y2="82" stroke="rgba(0,0,0,0.08)" stroke-width="1.5" stroke-linecap="round" />
  
  <!-- Graduation cap -->
  <polygon points="60,18 45,26 60,34 75,26" fill="rgba(255,255,255,0.9)" />
  <rect x="71" y="26" width="2.5" height="10" rx="1" fill="rgba(255,255,255,0.7)" />
  <circle cx="72" cy="37" r="3" fill="rgba(255,255,255,0.8)" />
  
  <!-- Sparkles -->
  <circle cx="18" cy="55" r="2.5" fill="rgba(255,255,255,0.6)" />
  <circle cx="105" cy="40" r="2" fill="rgba(255,255,255,0.5)" />
  <circle cx="100" cy="75" r="3" fill="rgba(255,255,255,0.4)" />
</svg>